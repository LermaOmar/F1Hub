spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: root
    password: root
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  application:
    name: F1Hub
    
security:
  jwt:
    key: ${KEY}
    expiration-time: ${EXPIRATION_TIME}