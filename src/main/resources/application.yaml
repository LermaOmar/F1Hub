spring:
  uploadDir: "./images"
  web:
    resources:
      static-locations:
        - classpath:/static/images

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  datasource:
    primary:
      jdbc-url: jdbc:h2:file:./data/primary;MODE=MySQL
      username: root
      password: root
      driver-class-name: org.h2.Driver
    secondary:
      jdbc-url: jdbc:h2:file:./data/secondary;MODE=MySQL
      username: root
      password: root
      driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  application:
    name: F1Hub

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${USER}
    password: ${PASSWORD}
    properties:
      mail:
        smtp.starttls.enable: true
        smtp.auth: true

security:
  jwt:
    key: ${KEY}
    expiration-time: ${EXPIRATION_TIME}
