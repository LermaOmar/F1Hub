<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Activation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2 style="color: #333;">Hi <span th:text="${username}">user</span>,</h2>

    <p>Thanks for join us, click to verify your account:</p>

    <p style="text-align: center; margin: 30px 0;">
        <a th:href="${activationUrl}"
           style="background-color: #28a745; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px;">
            Activate Account
        </a>
    </p>

    <p style="text-align: center; margin: 30px 0">This link will be expired in 30 minutes.</p>

</div>
</body>
</html>
